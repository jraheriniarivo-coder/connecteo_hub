:root{--primary:#ffa900;--primary-dark:#e69500;--accent:#00afa9;--sapphire:#0d47a1;--violet:#7c4dff;--danger:#c62828;--text-dark:#212121;--text-medium:#424242;--text-light:#757575;--white:#fff;--bg-glass:rgba(255,255,255,0.92);--bg-main:linear-gradient(135deg,#f0f4f8 0%,#e2e8f0 100%);--border-glass:rgba(255,255,255,0.6);--left-w:400px;--col-task-w:250px;--col-dates-w:150px;}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}body{font-family:'Mada',sans-serif;background:var(--bg-main);color:var(--text-dark);overflow:hidden}
.bg-decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}.bg-decor .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;animation:float 18s ease-in-out infinite;transition:opacity .5s}.bg-decor .orb:nth-child(1){width:500px;height:500px;background:radial-gradient(circle,rgba(255,169,0,.6),transparent 70%);top:-150px;right:-100px}.bg-decor .orb:nth-child(2){width:400px;height:400px;background:radial-gradient(circle,rgba(13,71,161,.5),transparent 70%);bottom:-100px;left:-100px;animation-delay:-6s}.bg-decor .orb:nth-child(3){width:350px;height:350px;background:radial-gradient(circle,rgba(0,175,169,.4),transparent 70%);top:40%;left:50%;animation-delay:-12s}@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-40px) scale(1.1)}66%{transform:translate(-20px,30px) scale(.95)}}

.welcome-title{font-size:32px;font-weight:900;color:var(--sapphire);margin-bottom:5px}.welcome-subtitle{font-size:16px;color:var(--text-medium);margin-bottom:30px}.project-selector{width:100%;padding:14px 18px;font-family:'Mada',sans-serif;font-size:16px;border:1px solid rgba(0,0,0,.1);border-radius:12px;background:#fff;color:var(--text-dark);cursor:pointer;margin-bottom:20px;outline:none;box-shadow:0 2px 10px rgba(0,0,0,.02);transition:all .3s}.project-selector:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,169,0,.2)}.btn-welcome{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-family:'Mada',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s;margin-bottom:12px;box-shadow:0 4px 15px rgba(255,169,0,.3)}.btn-welcome:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,169,0,.4)}.btn-welcome.outline{background:transparent;border:2px solid var(--primary);color:var(--primary);box-shadow:none}.btn-welcome.outline:hover{background:rgba(255,169,0,.08);box-shadow:none}
.app-header{background:var(--bg-glass);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.05);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;z-index:30;box-shadow:0 4px 20px rgba(0,0,0,.03)}.header-left{display:flex;align-items:center;gap:16px}.btn-icon{width:36px;height:36px;border-radius:50%;border:none;background:#fff;color:var(--text-medium);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.05)}.btn-icon:hover{background:var(--primary);color:#fff;transform:scale(1.05)}.project-title{font-size:18px;font-weight:700;color:var(--sapphire)}.project-client{font-size:12px;color:var(--text-light);font-weight:500}.header-actions{display:flex;gap:10px;align-items:center}.btn-action{font-family:'Mada',sans-serif;padding:8px 16px;border-radius:8px;border:none;background:#fff;color:var(--text-dark);font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:.2s}.btn-action:hover{background:var(--primary);color:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,169,0,.2)}.btn-action.primary{background:var(--sapphire);color:#fff}.btn-action.primary:hover{background:#0b3a8a;box-shadow:0 4px 12px rgba(13,71,161,.3)}.btn-action.danger{background:#ffebee;color:var(--danger)}.btn-action.danger:hover{background:var(--danger);color:#fff}.btn-action.accent{background:var(--accent);color:#fff}.btn-action.accent:hover{background:#008a86}
.tabs-container{background:#fff;padding:0 24px;display:flex;gap:10px;border-bottom:1px solid rgba(0,0,0,.05);z-index:20;justify-content:space-between;align-items:center}.tabs-left{display:flex;gap:10px;overflow-x:auto}.tab{padding:16px 20px;font-size:14px;font-weight:700;color:var(--text-light);cursor:pointer;border-bottom:3px solid transparent;transition:.3s;display:flex;align-items:center;gap:8px;white-space:nowrap;border-radius:8px 8px 0 0}.tab:hover{color:var(--primary);background:rgba(255,169,0,.05)}.tab.active{color:var(--primary);border-bottom-color:var(--primary);background:rgba(255,169,0,.1)}
.main-content{flex:1;overflow:auto;position:relative;padding:20px 24px}.view-section{display:none}.view-section.active{display:block;animation:fadeUp .4s ease}
.framing-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.04);padding:40px;max-width:1000px;margin:0 auto}.framing-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px;border-bottom:2px solid var(--primary);padding-bottom:20px}.framing-title{font-size:24px;font-weight:900;color:var(--sapphire)}.framing-subtitle{font-size:14px;color:var(--text-light);margin-top:5px}.framing-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}.framing-block{display:flex;flex-direction:column}.framing-block.full-width{grid-column:span 2}.framing-label{font-size:12px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px}.framing-text{font-size:15px;color:var(--text-medium);line-height:1.6;white-space:pre-wrap;background:#f8fafc;padding:15px;border-radius:8px;min-height:80px;border:1px solid #eee}.framing-text.empty{color:#aaa;font-style:italic}.framing-textarea{width:100%;font-family:'Mada',sans-serif;font-size:15px;color:var(--text-medium);line-height:1.6;padding:15px;border-radius:8px;min-height:80px;border:1px solid var(--primary);outline:none;resize:vertical;background:#fff}.framing-textarea:focus{box-shadow:0 0 0 3px rgba(255,169,0,.15)}.framing-input{width:100%;font-family:'Mada',sans-serif;font-size:16px;font-weight:700;color:var(--sapphire);padding:10px 15px;border-radius:8px;border:1px solid var(--primary);outline:none}.framing-input:focus{box-shadow:0 0 0 3px rgba(255,169,0,.15)}.framing-actions{margin-top:20px;display:flex;gap:10px;justify-content:flex-end}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:20px}.kpi-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.03);display:flex;flex-direction:column;transition:.3s}.kpi-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.08)}.kpi-title{font-size:13px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:1px;margin-bottom:15px}.kpi-value{font-size:36px;font-weight:900;color:var(--sapphire);margin-bottom:5px}.kpi-desc{font-size:13px;color:var(--text-medium)}.progress-bar-bg{width:100%;height:12px;background:#eee;border-radius:6px;overflow:hidden;margin-top:15px}.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark));border-radius:6px;transition:width .5s ease;box-shadow:0 0 10px rgba(255,169,0,.4)}.upcoming-list{list-style:none}.upcoming-list li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px}.upcoming-list li:last-child{border-bottom:none}.upcoming-date{font-weight:700;color:var(--danger)}.upcoming-date.safe{color:var(--primary)}
.roadmap-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.04);display:flex;flex-direction:column;overflow:hidden;min-width:1000px}.roadmap-header{display:flex;border-bottom:1px solid #eee;background:#fafafa}.roadmap-header .col-task{width:var(--col-task-w);flex-shrink:0;padding:14px 20px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);border-right:1px solid #eee}.roadmap-header .col-dates{width:var(--col-dates-w);flex-shrink:0;padding:14px 10px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);border-right:1px solid #eee;text-align:center}.roadmap-header .col-timeline{flex:1;display:flex}.roadmap-month{flex:1;padding:14px 10px;font-size:12px;font-weight:700;color:var(--text-medium);text-align:center;border-right:1px solid #eee;min-width:100px}.roadmap-body{position:relative}.roadmap-row{display:flex;border-bottom:1px solid #f5f5f5}.roadmap-row.phase-row{background:#f8fafc;font-weight:700;font-size:13px;color:var(--sapphire)}.roadmap-row.phase-row .col-task{padding-left:20px}.roadmap-row.phase-row .col-dates{background:#f8fafc}.roadmap-row.task-row .col-task{padding-left:40px;font-size:13px;color:var(--text-medium)}.roadmap-row .col-task{width:var(--col-task-w);flex-shrink:0;padding:12px 20px;display:flex;align-items:center;gap:8px;border-right:1px solid #eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roadmap-row .col-dates{width:var(--col-dates-w);flex-shrink:0;padding:12px 10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-medium);border-right:1px solid #eee;background:#fff}.roadmap-row .col-timeline{flex:1;position:relative;height:40px;display:flex}.roadmap-row.phase-row .col-timeline{height:30px}.roadmap-row .grid-col{flex:1;border-right:1px solid #f5f5f5;min-width:100px}.bar-wrapper{position:absolute;top:50%;transform:translateY(-50%);height:100%;display:flex;align-items:center;width:100%;pointer-events:none}.bar{height:22px;border-radius:11px;position:absolute;pointer-events:auto;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1);transition:.2s;display:flex;align-items:center;padding:0 10px;font-size:11px;color:#fff;font-weight:600}.bar:hover{transform:scaleY(1.15);box-shadow:0 4px 15px rgba(0,0,0,.25);z-index:10}.bar.milestone{width:16px!important;height:16px;border-radius:4px;transform:rotate(45deg);padding:0}.bar.milestone:hover{transform:rotate(45deg) scale(1.15)}.svg-overlay{position:absolute;top:0;left:var(--left-w);width:calc(100% - var(--left-w));height:100%;pointer-events:none;z-index:5}.dep-path{fill:none;stroke:#90a4ae;stroke-width:1.5}.dep-arrow{fill:#90a4ae}
.kanban-board{display:flex;gap:20px;align-items:flex-start;min-width:900px;height:100%}.kanban-col{flex:1;background:#f8fafc;border-radius:12px;padding:15px;display:flex;flex-direction:column;min-height:500px;border:1px dashed #cbd5e1}.kanban-col-header{font-size:14px;font-weight:800;color:var(--text-medium);margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:2px solid #e2e8f0}.kanban-count{background:#e2e8f0;padding:2px 8px;border-radius:10px;font-size:12px}.kanban-col[data-status="todo"] .kanban-col-header{border-bottom-color:#cbd5e1}.kanban-col[data-status="doing"] .kanban-col-header{border-bottom-color:var(--accent)}.kanban-col[data-status="done"] .kanban-col-header{border-bottom-color:var(--primary)}.kanban-card{background:#fff;border-radius:8px;padding:15px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:grab;transition:.2s;border-left:4px solid #ccc;position:relative}.kanban-card:hover{box-shadow:0 6px 15px rgba(0,0,0,.1);transform:translateY(-2px)}.kanban-card:active{cursor:grabbing}.kanban-card.dragging{opacity:.5;transform:scale(.95)}.kanban-card-title{font-size:14px;font-weight:700;color:var(--text-dark);margin-bottom:8px}.kanban-card-meta{font-size:11px;color:var(--text-light);display:flex;flex-wrap:wrap;gap:8px;align-items:center}.kanban-card-badge{padding:2px 6px;border-radius:4px;font-weight:700;font-size:10px}.badge-high{background:#ffebee;color:var(--danger)}.badge-med{background:#fff3e0;color:var(--primary)}.badge-low{background:#e0f2f1;color:var(--accent)}
.checklist-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.04);padding:30px;max-width:900px;margin:0 auto}.checklist-phase-title{font-size:18px;font-weight:800;color:var(--sapphire);margin:30px 0 15px;padding-bottom:10px;border-bottom:2px solid var(--primary);display:flex;align-items:center;gap:10px}.checklist-phase-title:first-child{margin-top:0}.checklist-item{display:flex;align-items:flex-start;gap:15px;padding:12px;border-radius:8px;transition:.2s;cursor:pointer}.checklist-item:hover{background:#f8fafc;transform:translateX(5px)}.checklist-item input[type="checkbox"]{width:20px;height:20px;accent-color:var(--primary);cursor:pointer;margin-top:2px}.checklist-content{flex:1}.checklist-name{font-size:15px;font-weight:600;color:var(--text-dark)}.checklist-name.done{text-decoration:line-through;color:var(--text-light)}.checklist-meta{font-size:12px;color:var(--text-light);margin-top:4px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}.checklist-meta i{margin-right:4px}.badge-dep{background:#e0f2f1;color:var(--primary-dark);padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100}.modal-overlay.open{display:flex}.modal-content{background:#fff;border-radius:16px;width:600px;max-width:90%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:slideUp .3s ease}.modal-header{padding:20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--sapphire);font-size:18px}.modal-body{padding:20px;overflow-y:auto;flex:1}.modal-footer{padding:15px 20px;border-top:1px solid #eee;display:flex;justify-content:space-between;gap:10px}.modal-footer-right{display:flex;gap:10px}.form-group{margin-bottom:15px}.form-group label{display:block;font-size:12px;font-weight:700;color:var(--text-medium);margin-bottom:6px;text-transform:uppercase}.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-family:'Mada',sans-serif;font-size:14px;outline:none;transition:.2s}.form-group input:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,169,0,.1)}.form-row{display:flex;gap:15px}.form-row .form-group{flex:1}.dep-list-container{max-height:150px;overflow-y:auto;border:1px solid #ddd;border-radius:8px;padding:10px;background:#fafafa}.dep-checkbox-item{display:flex;align-items:center;gap:8px;padding:6px;font-size:13px;cursor:pointer;border-radius:4px}.dep-checkbox-item:hover{background:#eee}.dep-checkbox-item input{width:auto}.dep-phase-title{font-size:11px;font-weight:800;color:var(--text-light);margin:8px 0 4px 0;text-transform:uppercase}
@media print{@page{size:A4 landscape;margin:10mm}body{overflow:visible!important;background:#fff}.app-header,.tabs-container,.welcome-container,.btn-action,.btn-presentation-exit{display:none!important}.main-content{padding:0!important;overflow:visible!important}.view-section{display:none!important}#view-roadmap{display:block!important}.roadmap-card{box-shadow:none!important;border:1px solid #ccc!important;min-width:100%!important}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.svg-overlay{display:none!important}.roadmap-row .col-dates{border-right:1px solid #ccc!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

<body>

<div class="bg-decor"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<button class="btn-presentation-exit" onclick="togglePresentationMode()"><i class="fas fa-times"></i> Quitter la présentation</button>

<div id="view-welcome" class="view active">
  <div class="welcome-container">
    <div class="welcome-card">
      <div class="welcome-logo"></div>
      <h1 class="welcome-title">PMO</h1>
      <p class="welcome-subtitle">Project Management Office — Gestion de projets</p>
      <select id="welcomeProjectSelect" class="project-selector"></select>
      <button class="btn-welcome" onclick="openSelectedProject()">Ouvrir le projet <i class="fas fa-arrow-right"></i></button>
      <button class="btn-welcome outline" onclick="createNewProject()">+ Nouveau projet</button>
      <a href="admin.html" style="display:block;margin-top:15px;font-size:13px;color:#888;text-decoration:none"><i class="fas fa-arrow-left"></i> Retour au Hub</a>
    </div>
  </div>
</div>

<div id="view-project" class="view">
  <header class="app-header">
    <div class="header-left">
      <a href="admin.html" class="btn-icon" title="Retour au Hub"><i class="fas fa-house"></i></a>
      <div><div class="project-title" id="hdrProjectName">Nom</div><div class="project-client" id="hdrClientName">Client</div></div>
    </div>
    <div class="header-actions">
      <button class="btn-action" onclick="togglePresentationMode()"><i class="fas fa-desktop"></i> Mode Présentation</button>
      <button class="btn-action primary" onclick="openNewTaskModal()"><i class="fas fa-plus"></i> Tâche</button>
      <button class="btn-action primary" style="background:var(--primary)" onclick="openNewPhaseModal()"><i class="fas fa-plus"></i> Phase</button>
      <button class="btn-action" onclick="exportJSON()"><i class="fas fa-download"></i> Export</button>
      <button class="btn-action" onclick="window.print()"><i class="fas fa-print"></i> PDF</button>
    </div>
  </header>

  <div class="tabs-container">
    <div class="tabs-left">
      <div class="tab" id="tab-framing" onclick="switchTab('framing')"><i class="fas fa-file-signature"></i> Fiche Projet</div>
      <div class="tab active" id="tab-roadmap" onclick="switchTab('roadmap')"><i class="fas fa-chart-gantt"></i> Roadmap</div>
      <div class="tab" id="tab-kanban" onclick="switchTab('kanban')"><i class="fas fa-columns"></i> Kanban</div>
      <div class="tab" id="tab-checklist" onclick="switchTab('checklist')"><i class="fas fa-list-check"></i> Checklist</div>
      <div class="tab" id="tab-dashboard" onclick="switchTab('dashboard')"><i class="fas fa-chart-pie"></i> Tableau de bord</div>
    </div>
  </div>

  <div class="main-content">
    <div id="view-framing" class="view-section"><div class="framing-card" id="framingContainer"></div></div>
    <div id="view-roadmap" class="view-section active"><div class="roadmap-card" id="roadmapContainer"></div></div>
    <div id="view-kanban" class="view-section"><div class="kanban-board" id="kanbanContainer"></div></div>
    <div id="view-checklist" class="view-section"><div class="checklist-card" id="checklistContainer"></div></div>
    <div id="view-dashboard" class="view-section">
      <div class="dashboard-grid">
        <div class="kpi-card" style="grid-column:span 2"><div class="kpi-title">Progression Globale</div><div style="display:flex;align-items:center;gap:20px"><div class="kpi-value" id="dashProgVal">0%</div><div style="flex:1"><div class="progress-bar-bg"><div class="progress-bar-fill" id="dashProgBar" style="width:0%"></div></div><div class="kpi-desc" style="margin-top:8px" id="dashProgTxt">0 tâches terminées sur 0</div></div></div></div>
        <div class="kpi-card"><div class="kpi-title">Répartition</div><div style="display:flex;justify-content:space-between;text-align:center;margin-top:15px"><div><div class="kpi-value" style="font-size:24px;color:#cbd5e1" id="dashTodoCount">0</div><div class="kpi-desc">À faire</div></div><div><div class="kpi-value" style="font-size:24px;color:var(--accent)" id="dashDoingCount">0</div><div class="kpi-desc">En cours</div></div><div><div class="kpi-value" style="font-size:24px;color:var(--primary)" id="dashDoneCount">0</div><div class="kpi-desc">Terminé</div></div></div></div>
        <div class="kpi-card" style="grid-column:span 2"><div class="kpi-title">Prochaines Échéances</div><ul class="upcoming-list" id="dashUpcoming"></ul></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <div class="modal-header"><span id="modalTitle">Modifier</span><button class="btn-icon" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer"><div id="modalDeleteContainer"><button class="btn-action danger" onclick="deleteCurrentItem()"><i class="fas fa-trash"></i> Supprimer</button></div><div class="modal-footer-right"><button class="btn-action" onclick="closeModal()">Annuler</button><button class="btn-action primary" onclick="saveModal()">Enregistrer</button></div></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'pmo_data_v1';
let projects = {}, currentProjectId = null, modalContext = { type: null, taskId: null, phaseId: null }, isFramingEditMode = false;

const defaultProject = {
  id: 'pmo-2026', name: 'Déploiement ERP', client: 'Direction Générale',
  framing: {
    context: "Déploiement d'un nouvel ERP sur l'ensemble des sites européens.",
    objectives: "1. Migrer les données.\n2. Former les utilisateurs.\n3. Assurer la maintenance.",
    budget: "250 000 € HT",
    stakeholders: "DSI, RH, Direction Financière.",
    risks: "Résistance au changement.\nRetard de migration."
  },
  phases: [
    { id: 'p1', name: 'Cadrage', color: '#0d47a1', tasks: [
      { id: 't1', name: 'Lancement du projet', start: '2026-11-02', end: '2026-11-03', responsible: 'Directeur Projet', progress: 100, status: 'done', priority: 'high', isMilestone: true, deps: [] },
      { id: 't2', name: 'Rédaction du cahier des charges', start: '2026-11-04', end: '2026-11-15', responsible: 'Business Analyst', progress: 50, status: 'doing', priority: 'high', isMilestone: false, deps: ['t1'] }
    ]},
    { id: 'p2', name: 'Déploiement', color: '#ffa900', tasks: [
      { id: 't3', name: 'Installation infrastructure', start: '2026-11-18', end: '2026-11-30', responsible: 'Équipe IT', progress: 0, status: 'todo', priority: 'high', isMilestone: false, deps: ['t2'] },
      { id: 't4', name: 'Paramétrage', start: '2026-12-01', end: '2026-12-15', responsible: 'Consultant', progress: 0, status: 'todo', priority: 'high', isMilestone: false, deps: ['t3'] }
    ]}
  ]
};

function init() { const d = localStorage.getItem(STORAGE_KEY); if(d){projects=JSON.parse(d);Object.values(projects).forEach(p=>{if(!p.framing)p.framing={context:'',objectives:'',budget:'',stakeholders:'',risks:''}})}else{projects={[defaultProject.id]:defaultProject};saveData()} renderWelcome(); }
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); }
function getTodayISO() { return new Date().toISOString().split('T')[0]; }
function parseDate(s) { const[y,m,d]=s.split('-');return new Date(y,m-1,d); }
function diffDays(d1,d2) { return Math.round((d2-d1)/(1000*60*60*24)); }
function formatDate(s) { if(!s)return'';const d=parseDate(s);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }

function renderWelcome() { const s=document.getElementById('welcomeProjectSelect');s.innerHTML='';Object.values(projects).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=`${p.name} — ${p.client}`;s.appendChild(o)});document.getElementById('view-welcome').classList.add('active');document.getElementById('view-project').classList.remove('active'); }
function openSelectedProject() { currentProjectId=document.getElementById('welcomeProjectSelect').value;if(!currentProjectId)return;document.getElementById('view-welcome').classList.remove('active');document.getElementById('view-project').classList.add('active');const p=projects[currentProjectId];document.getElementById('hdrProjectName').textContent=p.name;document.getElementById('hdrClientName').textContent=p.client||'Client';switchTab('roadmap'); }
function createNewProject() { const n=prompt("Nom du projet :");if(!n)return;const c=prompt("Client :")||"Interne";const id='proj_'+Date.now();projects[id]={id,name:n,client:c,framing:{context:'',objectives:'',budget:'',stakeholders:'',risks:''},phases:[]};saveData();renderWelcome();document.getElementById('welcomeProjectSelect').value=id; }
function switchTab(t) { document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view-section').forEach(v=>v.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');document.getElementById('view-'+t).classList.add('active');if(t==='framing')renderFraming();else if(t==='dashboard')renderDashboard();else if(t==='roadmap')renderRoadmap();else if(t==='kanban')renderKanban();else if(t==='checklist')renderChecklist(); }
function togglePresentationMode() { document.body.classList.toggle('presentation-mode');if(document.body.classList.contains('presentation-mode')){const c=document.querySelector('.tab.active').id.replace('tab-','');if(c==='framing'&&!isFramingEditMode)switchTab('dashboard');if(isFramingEditMode){isFramingEditMode=false;renderFraming();}} }

function renderFraming() {
  const p=projects[currentProjectId],container=document.getElementById('framingContainer'),f=p.framing||{context:'',objectives:'',budget:'',stakeholders:'',risks:''};
  let html=`<div class="framing-header"><div><div class="framing-title">Fiche Projet</div><div class="framing-subtitle">Définition et périmètre du projet</div></div>${!isFramingEditMode?`<button class="btn-action primary" onclick="toggleFramingEdit()"><i class="fas fa-pen"></i> Modifier</button>`:''}</div><div class="framing-grid">
    <div class="framing-block full-width"><div class="framing-label"><i class="fas fa-align-left"></i> Contexte & Enjeux</div>${isFramingEditMode?`<textarea id="fContext" class="framing-textarea" rows="4">${f.context}</textarea>`:`<div class="framing-text ${!f.context?'empty':''}">${f.context||'Non renseigné'}</div>`}</div>
    <div class="framing-block"><div class="framing-label"><i class="fas fa-bullseye"></i> Objectifs</div>${isFramingEditMode?`<textarea id="fObjectives" class="framing-textarea" rows="4">${f.objectives}</textarea>`:`<div class="framing-text ${!f.objectives?'empty':''}">${f.objectives||'Non renseigné'}</div>`}</div>
    <div class="framing-block"><div class="framing-label"><i class="fas fa-euro-sign"></i> Budget</div>${isFramingEditMode?`<input type="text" id="fBudget" class="framing-input" value="${f.budget}">`:`<div class="framing-text ${!f.budget?'empty':''}">${f.budget||'Non renseigné'}</div>`}</div>
    <div class="framing-block"><div class="framing-label"><i class="fas fa-users"></i> Parties Prenantes</div>${isFramingEditMode?`<textarea id="fStakeholders" class="framing-textarea" rows="3">${f.stakeholders}</textarea>`:`<div class="framing-text ${!f.stakeholders?'empty':''}">${f.stakeholders||'Non renseigné'}</div>`}</div>
    <div class="framing-block"><div class="framing-label"><i class="fas fa-exclamation-triangle"></i> Risques Identifiés</div>${isFramingEditMode?`<textarea id="fRisks" class="framing-textarea" rows="3">${f.risks}</textarea>`:`<div class="framing-text ${!f.risks?'empty':''}">${f.risks||'Non renseigné'}</div>`}</div>
    </div>${isFramingEditMode?`<div class="framing-actions"><button class="btn-action" onclick="toggleFramingEdit()">Annuler</button><button class="btn-action primary" onclick="saveFraming()">Enregistrer</button></div>`:''}`;
  container.innerHTML=html;
}
function toggleFramingEdit(){isFramingEditMode=!isFramingEditMode;renderFraming();}
function saveFraming(){const p=projects[currentProjectId];p.framing={context:document.getElementById('fContext').value,objectives:document.getElementById('fObjectives').value,budget:document.getElementById('fBudget').value,stakeholders:document.getElementById('fStakeholders').value,risks:document.getElementById('fRisks').value};saveData();isFramingEditMode=false;renderFraming();}

function renderDashboard() {
  const p=projects[currentProjectId];let total=0,done=0,doing=0,todo=0,all=[];p.phases.forEach(ph=>ph.tasks.forEach(t=>{total++;all.push(t);if(t.status==='done'||t.progress===100)done++;else if(t.status==='doing'||(t.progress>0&&t.progress<100))doing++;else todo++}));
  const pct=total===0?0:Math.round((done/total)*100);document.getElementById('dashProgVal').textContent=pct+'%';document.getElementById('dashProgBar').style.width=pct+'%';document.getElementById('dashProgTxt').textContent=`${done} tâche(s) terminée(s) sur ${total}`;document.getElementById('dashTodoCount').textContent=todo;document.getElementById('dashDoingCount').textContent=doing;document.getElementById('dashDoneCount').textContent=done;
  const ul=document.getElementById('dashUpcoming');ul.innerHTML='';const today=new Date();today.setHours(0,0,0,0);const sorted=all.filter(t=>t.status!=='done'&&t.progress<100&&t.end).sort((a,b)=>parseDate(a.end)-parseDate(b.end)).slice(0,5);
  if(sorted.length===0)ul.innerHTML='<li style="color:#999;justify-content:center">Aucune échéance.</li>';else sorted.forEach(t=>{const d=parseDate(t.end),days=diffDays(today,d);let cls='safe',lab=`Dans ${days} j`;if(days<0){cls='';lab=`En retard (${Math.abs(days)} j)`}else if(days<=3){cls='';lab=`Dans ${days} j !`}ul.innerHTML+=`<li><span><strong>${t.name}</strong> <span style="color:#999;font-size:12px">(${t.responsible||'Non assigné'})</span></span><span class="upcoming-date ${cls}">${formatDate(t.end)} - ${lab}</span></li>`});
}

function renderRoadmap() {
  const p=projects[currentProjectId],container=document.getElementById('roadmapContainer');let min=null,max=null;p.phases.forEach(ph=>ph.tasks.forEach(t=>{const s=parseDate(t.start),e=parseDate(t.end);if(!min||s<min)min=s;if(!max||e>max)max=e}));if(!min){container.innerHTML='<div style="padding:40px;text-align:center;color:#999">Aucune tâche.</div>';return}
  const start=new Date(min.getFullYear(),min.getMonth(),1),end=new Date(max.getFullYear(),max.getMonth()+1,0),totalDays=diffDays(start,end)+1;
  let html='<div class="roadmap-header"><div class="col-task">Phase / Tâche</div><div class="col-dates">Dates</div><div class="col-timeline">';let cur=new Date(start);while(cur<=end){const mEnd=new Date(cur.getFullYear(),cur.getMonth()+1,0),days=diffDays(cur,mEnd)+1,w=(days/totalDays)*100,mName=cur.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});html+=`<div class="roadmap-month" style="flex:0 0 ${w}%">${mName.charAt(0).toUpperCase()+mName.slice(1)}</div>`;cur=new Date(cur.getFullYear(),cur.getMonth()+1,1)}html+='</div></div><div class="roadmap-body" id="roadmapBody"><svg class="svg-overlay" id="dependencySvg"></svg>';
  p.phases.forEach(ph=>{html+=`<div class="roadmap-row phase-row"><div class="col-task" onclick="openEditPhaseModal('${ph.id}')" style="cursor:pointer"><span style="width:10px;height:10px;border-radius:3px;background:${ph.color};display:inline-block"></span> ${ph.name}</div><div class="col-dates"></div><div class="col-timeline">`;let cm=new Date(start);while(cm<=end){const mEnd=new Date(cm.getFullYear(),cm.getMonth()+1,0),d=diffDays(cm,mEnd)+1;html+=`<div class="grid-col" style="flex:0 0 ${(d/totalDays)*100}%"></div>`;cm=new Date(cm.getFullYear(),cm.getMonth()+1,1)}html+='</div></div>';
    ph.tasks.forEach(t=>{const tS=parseDate(t.start),tE=parseDate(t.end),lP=(diffDays(start,tS)/totalDays)*100,wP=Math.max(0.5,(diffDays(tS,tE)/totalDays)*100),sStr=formatDate(t.start).substring(0,5),eStr=formatDate(t.end).substring(0,5);html+=`<div class="roadmap-row task-row"><div class="col-task" title="${t.name}">${t.name}</div><div class="col-dates">${sStr} <i class="fas fa-arrow-right" style="font-size:10px;color:#ccc;margin:0 4px"></i> ${eStr}</div><div class="col-timeline">`;let cm2=new Date(start);while(cm2<=end){const mEnd=new Date(cm2.getFullYear(),cm2.getMonth()+1,0),d=diffDays(cm2,mEnd)+1;html+=`<div class="grid-col" style="flex:0 0 ${(d/totalDays)*100}%"></div>`;cm2=new Date(cm2.getFullYear(),cm2.getMonth()+1,1)}
      const isM=t.isMilestone||diffDays(tS,tE)<=1;if(isM)html+=`<div class="bar-wrapper"><div id="bar-${t.id}" class="bar milestone" style="left:${lP}%;background:${ph.color}" onclick="openEditTaskModal('${t.id}','${ph.id}')" title="${t.name}"></div></div>`;else{const rem=100-(t.progress||0);html+=`<div class="bar-wrapper"><div id="bar-${t.id}" class="bar" style="left:${lP}%;width:${wP}%;background:${ph.color}" onclick="openEditTaskModal('${t.id}','${ph.id}')" title="${t.name} - ${t.progress||0}%">${wP>10?t.name:''}${rem>0?`<div style="position:absolute;right:0;top:0;bottom:0;width:${rem}%;background:rgba(255,255,255,.3);border-radius:0 11px 11px 0"></div>`:''}</div></div>`}html+='</div></div>'})});html+='</div>';container.innerHTML=html;requestAnimationFrame(()=>drawDependencies(p));
}

function drawDependencies(p) {
  const svg=document.getElementById('dependencySvg'),body=document.getElementById('roadmapBody');if(!svg||!body)return;svg.innerHTML=`<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" class="dep-arrow"/></marker></defs>`;
  const bR=body.getBoundingClientRect(),sR=svg.getBoundingClientRect(),all=[];p.phases.forEach(ph=>ph.tasks.forEach(t=>all.push(t)));
  all.forEach(task=>{if(!task.deps||task.deps.length===0)return;const tEl=document.getElementById(`bar-${task.id}`);if(!tEl)return;const tR=tEl.getBoundingClientRect();task.deps.forEach(dId=>{const sEl=document.getElementById(`bar-${dId}`);if(!sEl)return;const sR2=sEl.getBoundingClientRect(),x1=sR2.right-sR.left,y1=sR2.top+sR2.height/2-bR.top,x2=tR.left-sR.left,y2=tR.top+tR.height/2-bR.top;let pStr='';if(x2>x1+15)pStr=`M ${x1} ${y1} C ${x1+(x2-x1)/2} ${y1}, ${x2-(x2-x1)/2} ${y2}, ${x2} ${y2}`;else{const mY=y1+(y2-y1)/2;pStr=`M ${x1} ${y1} L ${x1+15} ${y1} L ${x1+15} ${mY} L ${x2-15} ${mY} L ${x2-15} ${y2} L ${x2} ${y2}`}const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',pStr);path.setAttribute('class','dep-path');path.setAttribute('marker-end','url(#arrowhead)');svg.appendChild(path)})})
}

function renderKanban() {
  const p=projects[currentProjectId],container=document.getElementById('kanbanContainer'),cols=[{id:'todo',title:'À faire'},{id:'doing',title:'En cours'},{id:'done',title:'Terminé'}];let html='';
  cols.forEach(col=>{let tIn=[];p.phases.forEach(ph=>ph.tasks.forEach(t=>{if(t.progress===100)t.status='done';else if(t.progress>0&&t.status!=='doing')t.status='doing';else if(t.progress===0&&t.status!=='todo')t.status='todo';if(!t.status)t.status='todo';if(t.status===col.id)tIn.push({task:t,phase:ph})}));html+=`<div class="kanban-col" data-status="${col.id}" ondragover="allowDrop(event)" ondrop="drop(event,'${col.id}')"><div class="kanban-col-header"><span>${col.title}</span><span class="kanban-count">${tIn.length}</span></div><div class="kanban-cards" style="flex:1;overflow-y:auto">`;tIn.forEach(({task:t,phase:ph})=>{const prC=t.priority==='high'?'badge-high':(t.priority==='low'?'badge-low':'badge-med'),prL=t.priority==='high'?'Haute':(t.priority==='low'?'Basse':'Moyenne');html+=`<div class="kanban-card" draggable="true" ondragstart="drag(event,'${t.id}')" style="border-left-color:${ph.color}" onclick="openEditTaskModal('${t.id}','${ph.id}')"><div class="kanban-card-title">${t.name}</div><div class="kanban-card-meta"><span><i class="far fa-calendar-alt"></i> ${formatDate(t.end)}</span>${t.responsible?`<span><i class="far fa-user"></i> ${t.responsible}</span>`:''}</div><div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center"><span class="kanban-card-badge ${prC}">${prL}</span><span style="font-size:11px;font-weight:700;color:${ph.color}">${t.progress||0}%</span></div></div>`});html+='</div></div>'});container.innerHTML=html;
}
function allowDrop(e){e.preventDefault()}function drag(e,id){e.dataTransfer.setData("taskId",id);e.target.classList.add('dragging')}function drop(e,st){e.preventDefault();const id=e.dataTransfer.getData("taskId"),p=projects[currentProjectId];let f=null;p.phases.forEach(ph=>{const t=ph.tasks.find(x=>x.id===id);if(t)f=t});if(f){f.status=st;if(st==='done')f.progress=100;else if(st==='doing'&&f.progress===0)f.progress=50;else if(st==='doing'&&f.progress===100)f.progress=50;else if(st==='todo')f.progress=0;saveData();renderKanban()}document.querySelectorAll('.kanban-card').forEach(c=>c.classList.remove('dragging'))}

function renderChecklist() {
  const p=projects[currentProjectId],container=document.getElementById('checklistContainer');let html='';if(p.phases.length===0){container.innerHTML='<div style="padding:40px;text-align:center;color:#999">Aucune phase.</div>';return}
  p.phases.forEach(ph=>{html+=`<div class="checklist-phase-title" style="border-bottom-color:${ph.color}"><span style="width:12px;height:12px;border-radius:4px;background:${ph.color};display:inline-block"></span> ${ph.name}</div>`;if(ph.tasks.length===0)html+='<p style="color:#999;font-size:13px;padding-left:20px">Aucune tâche.</p>';ph.tasks.forEach(t=>{const isD=t.progress===100||t.status==='done',hasD=t.deps&&t.deps.length>0;html+=`<div class="checklist-item" onclick="toggleTask('${t.id}','${ph.id}')"><input type="checkbox" ${isD?'checked':''} onclick="event.stopPropagation();toggleTask('${t.id}','${ph.id}')"><div class="checklist-content"><div class="checklist-name ${isD?'done':''}">${t.name} ${t.isMilestone?'<i class="fas fa-diamond" style="color:var(--accent);font-size:10px;margin-left:5px"></i>':''}${hasD?`<span class="badge-dep" style="margin-left:8px"><i class="fas fa-link"></i> ${t.deps.length}</span>`:''}</div><div class="checklist-meta"><span><i class="far fa-calendar-alt"></i> ${formatDate(t.start)} au ${formatDate(t.end)}</span>${t.responsible?`<span><i class="far fa-user"></i> ${t.responsible}</span>`:''}</div></div></div>`})});container.innerHTML=html;
}
function toggleTask(tid,pid){const p=projects[currentProjectId],ph=p.phases.find(x=>x.id===pid),t=ph.tasks.find(x=>x.id===tid);if(t){const isD=t.progress===100;t.progress=isD?0:100;t.status=isD?'todo':'done';saveData();renderChecklist()}}

function openNewTaskModal(){const p=projects[currentProjectId];if(p.phases.length===0){alert("Créez d'abord une phase.");return}modalContext={type:'new_task',taskId:null,phaseId:p.phases[0].id};document.getElementById('modalTitle').textContent='Nouvelle tâche';document.getElementById('modalDeleteContainer').style.display='none';buildTaskForm(null);document.getElementById('modalOverlay').classList.add('open')}
function openEditTaskModal(tid,pid){modalContext={type:'task',taskId:tid,phaseId:pid};const p=projects[currentProjectId],ph=p.phases.find(x=>x.id===pid),t=ph.tasks.find(x=>x.id===tid);document.getElementById('modalTitle').textContent='Modifier la tâche';document.getElementById('modalDeleteContainer').style.display='block';buildTaskForm(t);document.getElementById('modalOverlay').classList.add('open')}

function buildTaskForm(task) {
  const p=projects[currentProjectId],t=task||{name:'',start:getTodayISO(),end:getTodayISO(),responsible:'',progress:0,status:'todo',priority:'med',isMilestone:false,deps:[]};let phOpts=p.phases.map(ph=>`<option value="${ph.id}" ${(modalContext.phaseId===ph.id?'selected':'')}>${ph.name}</option>`).join('');let depsHtml='<div class="dep-list-container">',hasO=false;
  p.phases.forEach(ph=>{const oT=ph.tasks.filter(ot=>ot.id!==t.id);if(oT.length>0){hasO=true;depsHtml+=`<div class="dep-phase-title" style="color:${ph.color}">${ph.name}</div>`;oT.forEach(ot=>{const isC=(t.deps||[]).includes(ot.id)?'checked':'';depsHtml+=`<label class="dep-checkbox-item"><input type="checkbox" class="dep-cb" value="${ot.id}" ${isC}><span>${ot.name}</span></label>`})}});if(!hasO)depsHtml+='<div style="font-size:12px;color:#999">Aucune autre tâche.</div>';depsHtml+='</div>';
  let html=`<div class="form-group"><label>Nom de la tâche</label><input type="text" id="mTaskName" value="${t.name}" placeholder="Ex: Phase de test"></div>
    <div class="form-row"><div class="form-group"><label>Phase rattachée</label><select id="mTaskPhase">${phOpts}</select></div><div class="form-group"><label>Priorité</label><select id="mTaskPriority"><option value="high" ${t.priority==='high'?'selected':''}>Haute</option><option value="med" ${t.priority==='med'?'selected':''}>Moyenne</option><option value="low" ${t.priority==='low'?'selected':''}>Basse</option></select></div></div>
    <div class="form-row"><div class="form-group"><label>Début</label><input type="date" id="mTaskStart" value="${t.start}"></div><div class="form-group"><label>Fin</label><input type="date" id="mTaskEnd" value="${t.end}"></div></div>
    <div class="form-row"><div class="form-group"><label>Responsable</label><input type="text" id="mTaskResp" value="${t.responsible||''}"></div><div class="form-group"><label>Avancement (%)</label><input type="number" id="mTaskProg" min="0" max="100" value="${t.progress||0}"></div></div>
    <div class="form-group"><label><input type="checkbox" id="mTaskMile" ${t.isMilestone?'checked':''}> Marquer comme jalon</label></div>
    <div class="form-group"><label>Dépendances</label>${depsHtml}</div>`;document.getElementById('modalBody').innerHTML=html;
}

function openNewPhaseModal(){modalContext={type:'new_phase',taskId:null,phaseId:null};document.getElementById('modalTitle').textContent='Nouvelle phase';document.getElementById('modalDeleteContainer').style.display='none';buildPhaseForm(null);document.getElementById('modalOverlay').classList.add('open')}
function openEditPhaseModal(pid){modalContext={type:'phase',taskId:null,phaseId:pid};const p=projects[currentProjectId],ph=p.phases.find(x=>x.id===pid);document.getElementById('modalTitle').textContent='Modifier la phase';document.getElementById('modalDeleteContainer').style.display='block';buildPhaseForm(ph);document.getElementById('modalOverlay').classList.add('open')}
function buildPhaseForm(phase){const colors=['#ffa900','#00afa9','#7c4dff','#e91e63','#3f51b5','#096475'],cur=phase?phase.color:colors[0];let sw=colors.map(c=>`<label style="display:inline-block;margin-right:10px;cursor:pointer"><input type="radio" name="phaseColor" value="${c}" ${c===cur?'checked':''} style="display:none"><span style="display:inline-block;width:30px;height:30px;border-radius:50%;background:${c};border:2px solid ${c===cur?'#333':'transparent'}"></span></label>`).join('');let html=`<div class="form-group"><label>Nom de la phase</label><input type="text" id="mPhaseName" value="${phase?phase.name:''}" placeholder="Ex: Conception"></div><div class="form-group"><label>Couleur</label><div>${sw}</div></div>`;document.getElementById('modalBody').innerHTML=html}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open')}

function saveModal() {
  const p=projects[currentProjectId];
  if(modalContext.type==='task'||modalContext.type==='new_task'){
    const name=document.getElementById('mTaskName').value;if(!name){alert('Nom requis.');return}const nPid=document.getElementById('mTaskPhase').value,prio=document.getElementById('mTaskPriority').value,start=document.getElementById('mTaskStart').value,end=document.getElementById('mTaskEnd').value,resp=document.getElementById('mTaskResp').value,prog=parseInt(document.getElementById('mTaskProg').value)||0,isM=document.getElementById('mTaskMile').checked,deps=Array.from(document.querySelectorAll('.dep-cb:checked')).map(cb=>cb.value);let nSt='todo';if(prog===100)nSt='done';else if(prog>0)nSt='doing';
    if(modalContext.type==='task'){const oPh=p.phases.find(x=>x.id===modalContext.phaseId),tIdx=oPh.tasks.findIndex(x=>x.id===modalContext.taskId),task=oPh.tasks[tIdx];Object.assign(task,{name,start,end,responsible:resp,progress:prog,status:nSt,priority:prio,isMilestone:isM,deps});if(oPh.id!==nPid){oPh.tasks.splice(tIdx,1);p.phases.find(x=>x.id===nPid).tasks.push(task)}}else{p.phases.find(x=>x.id===nPid).tasks.push({id:'t_'+Date.now(),name,start,end,responsible:resp,progress:prog,status:nSt,priority:prio,isMilestone:isM,deps})}
  }else if(modalContext.type==='phase'||modalContext.type==='new_phase'){
    const name=document.getElementById('mPhaseName').value;if(!name){alert('Nom requis.');return}const cIn=document.querySelector('input[name="phaseColor"]:checked'),col=cIn?cIn.value:'#ffa900';
    if(modalContext.type==='phase'){const ph=p.phases.find(x=>x.id===modalContext.phaseId);ph.name=name;ph.color=col}else{p.phases.push({id:'p_'+Date.now(),name,color:col,tasks:[]})}
  }
  saveData();closeModal();switchTab(document.querySelector('.tab.active').id.replace('tab-',''));
}

function deleteCurrentItem(){if(!confirm("Supprimer ?"))return;const p=projects[currentProjectId];if(modalContext.type==='task'){const ph=p.phases.find(x=>x.id===modalContext.phaseId);ph.tasks=ph.tasks.filter(t=>t.id!==modalContext.taskId);p.phases.forEach(ph2=>ph2.tasks.forEach(t=>{if(t.deps)t.deps=t.deps.filter(id=>id!==modalContext.taskId)}))}else if(modalContext.type==='phase'){p.phases=p.phases.filter(ph=>ph.id!==modalContext.phaseId)}saveData();closeModal();switchTab(document.querySelector('.tab.active').id.replace('tab-',''))}

function exportJSON(){const p=projects[currentProjectId],blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=p.name.replace(/[^a-z0-9]/gi,'-').toLowerCase()+'.json';a.click();URL.revokeObjectURL(url)}
window.addEventListener('resize',()=>{if(document.getElementById('view-project').classList.contains('active')&&document.getElementById('view-roadmap').classList.contains('active')){drawDependencies(projects[currentProjectId])}});
init();
</script>
